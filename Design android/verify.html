<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Verify Pass – Android Club Workshop</title>
  <meta name="description" content="Verify and mark attendance for the Android Development Workshop." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #3ddc84;
      --green-dark: #2bb86a;
      --bg: #080c0e;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.09);
      --text: #f0f4f8;
      --text-dim: rgba(240,244,248,0.55);
      --text-label: rgba(240,244,248,0.40);
      --error: #ff5252;
      --warn: #ffb300;
      --font: 'Inter', sans-serif;
      --font-h: 'Space Grotesk', sans-serif;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    svg { display:inline-block; flex-shrink:0; vertical-align:middle; }

    /* ── Aurora ── */
    .aurora {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px);
    }
    .b1 {
      width: 380px; height: 380px; opacity: 0.3;
      background: radial-gradient(circle, rgba(61,220,132,0.5) 0%, transparent 70%);
      top: -60px; right: -40px;
    }
    .b2 {
      width: 300px; height: 300px; opacity: 0.22;
      background: radial-gradient(circle, rgba(0,191,165,0.4) 0%, transparent 70%);
      bottom: 100px; left: -60px;
    }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      max-width: 460px; margin: 0 auto;
      padding: 48px 24px 60px;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }

    /* ── Header ── */
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.2em;
      color: var(--text-dim); text-transform: uppercase;
      margin-bottom: 32px; align-self: flex-start;
    }

    /* ── Status Icon ── */
    .status-icon {
      width: 80px; height: 80px; border-radius: 50%;
      border: 3px solid var(--green); background: rgba(61,220,132,0.08);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 0 0 8px rgba(61,220,132,0.06), 0 0 48px rgba(61,220,132,0.22);
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      flex-shrink: 0;
    }
    .status-icon.error-state {
      border-color: var(--error); background: rgba(255,82,82,0.08);
      box-shadow: 0 0 0 8px rgba(255,82,82,0.05), 0 0 48px rgba(255,82,82,0.18);
    }
    .status-icon.warn-state {
      border-color: var(--warn); background: rgba(255,179,0,0.08);
      box-shadow: 0 0 0 8px rgba(255,179,0,0.05), 0 0 48px rgba(255,179,0,0.15);
    }
    @keyframes pop { from { transform:scale(0.5); opacity:0; } to { transform:scale(1); opacity:1; } }

    /* ── Title ── */
    .status-title {
      font-family: var(--font-h);
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 800; text-align: center;
      letter-spacing: -0.01em; margin-bottom: 28px;
      width: 100%;
    }

    /* ── Card ── */
    .card {
      width: 100%; background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      margin-bottom: 14px;
    }

    /* ── Detail rows ── */
    .detail-row {
      display: flex; align-items: center; gap: 13px; padding: 8px 0;
    }
    .detail-row + .detail-row { border-top: 1px solid rgba(255,255,255,0.05); }
    .detail-icon {
      width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
      background: rgba(61,220,132,0.08); border: 1px solid rgba(61,220,132,0.15);
      display: flex; align-items: center; justify-content: center;
    }
    .detail-icon svg { color: var(--green); }
    .detail-text { display: flex; flex-direction: column; gap: 1px; }
    .detail-label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--text-label); text-transform: uppercase; }
    .detail-value { font-size: 14px; font-weight: 600; color: var(--text); }
    .mono { font-family: 'Courier New', monospace; letter-spacing: 0.08em; }

    /* ── Workshop badge ── */
    .workshop-badge {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-radius: 12px;
      background: rgba(61,220,132,0.06); border: 1px solid rgba(61,220,132,0.15);
      margin-bottom: 14px;
    }
    .workshop-badge-text { font-size: 13px; font-weight: 700; color: var(--green); }
    .workshop-badge-sub  { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

    /* ── Buttons ── */
    .btn {
      width: 100%; height: 54px; border: none; border-radius: 100px;
      font-family: var(--font); font-size: 13px; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: all 0.22s ease; margin-bottom: 10px;
    }
    .btn svg { width:18px!important; height:18px!important; flex-shrink:0; }
    .btn-green {
      background: linear-gradient(135deg, #3ddc84, #2bb86a); color: #080c0e;
      box-shadow: 0 4px 24px rgba(61,220,132,0.35), 0 1px 0 rgba(255,255,255,0.2) inset;
    }
    .btn-green:hover  { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(61,220,132,0.5); }
    .btn-green:active { transform: translateY(0); }
    .btn-ghost {
      background: rgba(255,255,255,0.04); color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.07); }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* ── Loading ── */
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(8,12,14,0.3);
      border-top-color: #080c0e; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error text ── */
    .error-text { font-size: 13px; color: var(--text-dim); text-align: center; line-height: 1.6; }
    .error-code  { font-size: 12px; font-family: monospace; color: var(--error); margin-top: 4px; display: block; }

    /* ── Loading state ── */
    #loading {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 60px 0;
    }
    .loading-ring {
      width: 48px; height: 48px; border: 3px solid rgba(61,220,132,0.2);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ── Divider ── */
    .hr { width:100%; height:1px; background:rgba(255,255,255,0.06); margin: 6px 0; }
  </style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
</div>

<div class="page">
  <div class="brand">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#3ddc84"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C14.15 1.23 13.11 1 12 1c-1.11 0-2.15.23-3.09.63L7.43.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.3 1.3C6.44 3.27 5.5 5 5.5 7h13c0-2-.94-3.73-2.97-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg>
    Android Club
  </div>

  <!-- Initial loading state -->
  <div id="loading">
    <div class="loading-ring"></div>
    <span style="font-size:13px;color:var(--text-dim);">Loading registration…</span>
  </div>

  <!-- Content (hidden until loaded) -->
  <div id="content" style="display:none;width:100%;display:none;flex-direction:column;align-items:center;">
    <!-- Injected by JS -->
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  WORKSHOP CONFIG
// ──────────────────────────────────────────────
const WORKSHOP = {
  name:  'Android Development Workshop',
  date:  'SAT, 18 OCT',
  time:  '10:00 AM – 1:00 PM',
  venue: 'Android Lab · Block A',
};

const DB_KEY = 'androidclub_v2';

// ──────────────────────────────────────────────
//  DATA (same localStorage — works when same
//  origin, e.g. same device or local server)
// ──────────────────────────────────────────────
function dbGetAll() {
  try { return JSON.parse(localStorage.getItem(DB_KEY) || '{}'); }
  catch { return {}; }
}
function dbGetById(id) {
  return dbGetAll()[id.trim().toUpperCase()] || null;
}
function dbMarkAttendance(id) {
  const all = dbGetAll();
  const upper = id.trim().toUpperCase();
  if (!all[upper]) return { ok: false, reason: 'not_found' };
  if (all[upper].checkedIn) return { ok: false, reason: 'duplicate', participant: all[upper] };
  all[upper].checkedIn   = true;
  all[upper].checkInTime = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  localStorage.setItem(DB_KEY, JSON.stringify(all));
  return { ok: true, participant: all[upper] };
}

// ──────────────────────────────────────────────
//  SVG HELPERS
// ──────────────────────────────────────────────
function svgStroke(path, size=16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${size}px;height:${size}px;flex-shrink:0;">${path}</svg>`;
}
const S = {
  user:   svgStroke(`<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>`),
  hash:   svgStroke(`<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>`),
  cal:    svgStroke(`<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>`),
  clock:  svgStroke(`<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`),
  loc:    svgStroke(`<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>`),
  check:  svgStroke(`<polyline points="20 6 9 17 4 12"/>`, 38),
  x:      svgStroke(`<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`, 38),
  warn:   svgStroke(`<polyline points="20 6 9 17 4 12"/>`, 38),
  android:`<svg width="18" height="18" viewBox="0 0 24 24" fill="#3ddc84" style="width:18px;height:18px;flex-shrink:0;"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C14.15 1.23 13.11 1 12 1c-1.11 0-2.15.23-3.09.63L7.43.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.3 1.3C6.44 3.27 5.5 5 5.5 7h13c0-2-.94-3.73-2.97-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg>`,
};

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ──────────────────────────────────────────────
//  DETAIL ROW BUILDER
// ──────────────────────────────────────────────
function detailRow(iconHtml, label, value, extraClass='') {
  return `
  <div class="detail-row">
    <div class="detail-icon">${iconHtml}</div>
    <div class="detail-text">
      <span class="detail-label">${label}</span>
      <span class="detail-value ${extraClass}">${esc(value)}</span>
    </div>
  </div>`;
}

// ──────────────────────────────────────────────
//  RENDER STATES
// ──────────────────────────────────────────────
function renderVerified(participant) {
  const isCheckedIn = participant.checkedIn;
  return `
  <div class="status-icon">${S.check}</div>
  <div class="status-title">✓ VERIFIED</div>

  <div class="workshop-badge">
    ${S.android}
    <div>
      <div class="workshop-badge-text">${WORKSHOP.name}</div>
      <div class="workshop-badge-sub">${WORKSHOP.date} · ${WORKSHOP.venue}</div>
    </div>
  </div>

  <div class="card">
    ${detailRow(S.user,  'Participant',      participant.name)}
    ${detailRow(S.hash,  'Registration ID',  participant.id, 'mono')}
    ${detailRow(S.cal,   'Date',             WORKSHOP.date)}
    ${detailRow(S.clock, 'Time',             WORKSHOP.time)}
    ${detailRow(S.loc,   'Venue',            WORKSHOP.venue)}
    ${isCheckedIn ? `<div class="hr"></div>${detailRow(S.clock, 'Checked In At', participant.checkInTime)}` : ''}
  </div>

  ${isCheckedIn
    ? `<div style="width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,179,0,0.08);border:1px solid rgba(255,179,0,0.2);margin-bottom:14px;text-align:center;font-size:13px;color:#ffb300;font-weight:600;">
        ✓ Already checked in at ${esc(participant.checkInTime)}
      </div>`
    : `<button class="btn btn-green" id="btn-mark" onclick="markAttendance('${esc(participant.id)}')">
        ${S.check.replace('38','18').replace(/style="[^"]*"/g, 'style="width:18px;height:18px;flex-shrink:0;"')}
        MARK ATTENDANCE
      </button>`
  }

  <button class="btn btn-ghost" onclick="history.back()">← Go Back</button>`;
}

function renderAlreadyCheckedIn(participant) {
  return `
  <div class="status-icon warn-state">${S.check}</div>
  <div class="status-title" style="color:var(--warn);">ALREADY<br>CHECKED IN</div>
  <div class="card">
    ${detailRow(S.user,  'Participant',    participant.name)}
    ${detailRow(S.hash,  'Registration ID', participant.id, 'mono')}
    ${detailRow(S.clock, 'Checked In At',  participant.checkInTime)}
  </div>
  <p class="error-text">This participant has already been checked in for this workshop.</p>
  <br>
  <button class="btn btn-ghost" style="margin-top:8px;" onclick="history.back()">← Go Back</button>`;
}

function renderSuccessMarked(participant) {
  return `
  <div class="status-icon">${S.check}</div>
  <div class="status-title">ATTENDANCE<br>MARKED</div>
  <div class="card">
    ${detailRow(S.user,  'Participant',    participant.name)}
    ${detailRow(S.hash,  'Registration ID', participant.id, 'mono')}
    ${detailRow(S.clock, 'Check-in Time',  participant.checkInTime)}
    <div class="hr"></div>
    ${detailRow(S.android, 'Workshop', WORKSHOP.name)}
  </div>
  <button class="btn btn-green" onclick="window.close()">✓&nbsp;&nbsp;DONE</button>
  <button class="btn btn-ghost" onclick="history.back()">← Go Back</button>`;
}

function renderError(rawId) {
  return `
  <div class="status-icon error-state">${S.x}</div>
  <div class="status-title" style="color:var(--error);">INVALID<br>REGISTRATION</div>
  <div class="card" style="border-color:rgba(255,82,82,0.2);">
    <div class="error-text">
      No registration found for this QR code.
      <span class="error-code">${esc(rawId || '—')}</span>
    </div>
  </div>
  <button class="btn btn-ghost" style="margin-top:8px;" onclick="history.back()">← Go Back</button>`;
}

// ──────────────────────────────────────────────
//  MARK ATTENDANCE (on this page)
// ──────────────────────────────────────────────
function markAttendance(id) {
  const btn = document.getElementById('btn-mark');
  if (btn) { btn.innerHTML = '<span class="spinner"></span>&nbsp;Marking…'; btn.disabled = true; }

  setTimeout(() => {
    const result = dbMarkAttendance(id);
    const content = document.getElementById('content');
    if (result.ok) {
      content.innerHTML = renderSuccessMarked(result.participant);
    } else if (result.reason === 'duplicate') {
      content.innerHTML = renderAlreadyCheckedIn(result.participant);
    } else {
      content.innerHTML = renderError(id);
    }
  }, 400);
}

// ──────────────────────────────────────────────
//  PARSE HASH FRAGMENT TO GET REG ID
// ──────────────────────────────────────────────
function parseRegId() {
  const hash = window.location.hash.replace('#', '');
  if (!hash) return null;

  // Try base64 JSON payload
  try {
    const decoded = JSON.parse(atob(decodeURIComponent(hash)));
    if (decoded && decoded.id) return decoded.id.toUpperCase();
  } catch (_) {}

  // Try plain ID in hash
  if (/^REG-/i.test(hash)) return hash.toUpperCase();

  // Try URL search params ?id=
  const params = new URLSearchParams(window.location.search);
  const idParam = params.get('id');
  if (idParam) return idParam.toUpperCase();

  return null;
}

// ──────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const loading = document.getElementById('loading');
    const content = document.getElementById('content');

    const regId = parseRegId();

    if (!regId) {
      loading.style.display = 'none';
      content.style.display = 'flex';
      content.innerHTML = `
        <div class="status-icon error-state">${S.x}</div>
        <div class="status-title" style="color:var(--error);">INVALID LINK</div>
        <div class="card"><div class="error-text">No registration ID found in this link. Please scan the QR code again.</div></div>
        <button class="btn btn-ghost" style="margin-top:8px;" onclick="history.back()">← Go Back</button>`;
      return;
    }

    const participant = dbGetById(regId);
    loading.style.display = 'none';
    content.style.display = 'flex';

    if (!participant) {
      content.innerHTML = renderError(regId);
    } else if (participant.checkedIn) {
      content.innerHTML = renderAlreadyCheckedIn(participant);
    } else {
      content.innerHTML = renderVerified(participant);
    }
  }, 500); // slight delay to show loading animation
});
</script>
</body>
</html>
